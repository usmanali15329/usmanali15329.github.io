markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag

collections:
  videos:
    output: true
    permalink: /videos/:name/

defaults:
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "videos"
    values:
      layout: "video"

# Categories used for _posts front matter: blog | htb | thm
# Videos live in _videos/ as individual markdown files with a `youtube_id`
# field that starts empty and can be filled in later via /admin.html

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
